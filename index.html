<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>มิไรบุ · เลือกเกม</title>
<link rel="stylesheet" href="shared/kids.css">
<style>
.scr>header{justify-content:center}
#grid{width:min(100%,1080px);display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,clamp(150px,22vw,270px)),1fr));grid-auto-rows:1fr;gap:clamp(14px,2.4vw,30px);padding:10px}
.card{--rot:-2deg;position:relative;display:grid;grid-template-rows:minmax(0,1fr) auto auto;gap:clamp(4px,1dvh,10px);aspect-ratio:1/1.05;
  padding:clamp(10px,2dvh,22px);border-radius:clamp(22px,3vw,36px);text-decoration:none;color:#fff;text-align:center;
  background:var(--cc);box-shadow:0 0 0 clamp(4px,.6vw,7px) #fff,0 24px 40px -16px rgba(0,0,0,.65);
  transform:rotate(var(--rot));transition:transform .4s var(--pop),box-shadow .3s;
  animation:pop-in .75s var(--pop) backwards;animation-delay:calc(var(--i)*120ms + 150ms)}
.card:nth-child(even){--rot:2deg}
.card:hover,.card:focus-visible{transform:rotate(0) translateY(-8px) scale(1.04);box-shadow:0 0 0 clamp(4px,.6vw,7px) var(--y),0 32px 46px -16px rgba(0,0,0,.7)}
.card:active{transform:rotate(0) scale(.97)}
.card:focus-visible{outline:0}
.art{min-height:0;display:grid;place-items:center;background:radial-gradient(closest-side,rgba(255,255,255,.28),transparent);border-radius:50%;animation:bob 3.6s ease-in-out infinite;animation-delay:calc(var(--i)*-1.1s)}
.art svg,.art img{max-width:100%;max-height:100%;width:78%;height:100%;object-fit:contain;filter:drop-shadow(0 8px 10px rgba(0,0,0,.3))}
.card:hover .art{animation:wiggle .6s ease-in-out}
@keyframes bob{50%{transform:translateY(-6%) rotate(2deg)}}
.nm{font-weight:600;font-size:clamp(17px,2.5vw,32px);line-height:1.15}
.rurl #qr svg{width:clamp(56px,10dvh,100px)}
.ds{font-size:clamp(12px,1.5vw,17px);opacity:.92;line-height:1.25}
</style>
</head>
<body>
<section class="scr on">
  <header><h1 class="ttl pop-in">เลือกเกม</h1></header>
  <main><div id="grid"></div></main>
  <footer><div class="rurl"><div id="qr" hidden></div><div id="rtxt"></div></div></footer>
</section>

<script src="shared/kids.js"></script>
<script src="shared/games.js"></script>
<script src="shared/vol.js"></script>
<script src="shared/bgm.js"></script>
<script src="shared/qrcode.js"></script>
<script src="shared/lobby.js"></script>
<script src="shared/config.js"></script>
<script src="shared/net.js"></script>
<script src="shared/remote-client.js"></script>
<script>
const $=id=>document.getElementById(id);
const g=$('grid');
GAMES.forEach((k,i)=>{
  const a=document.createElement('a');a.className='card';a.href=k.u;a.style.setProperty('--cc',k.c);a.style.setProperty('--i',i);
  const art=document.createElement('div');art.className='art';art.innerHTML=k.art;
  const n=document.createElement('div');n.className='nm';n.textContent=k.n;
  const d=document.createElement('div');d.className='ds';d.textContent=k.d;
  a.append(art,n,d);g.append(a);
});

BGM.init({allow:()=>true});
Remote.init({id:'picker',needsSound:true,qrEl:$('qr'),txtEl:$('rtxt'),lobby:()=>'',
  getUi:()=>({title:'เลือกเกม',games:true})});
</script>
</body>
</html>
