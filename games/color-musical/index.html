<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>เก้าอี้ดนตรี 4 โซน</title>
<link rel="stylesheet" href="../../shared/kids.css">
<style>
/* ---------- ตั้งค่า: เลือกโซน (วางเหมือนห้องจริง แถวบน = หน้าห้อง) ---------- */
.zsel{display:grid;grid-template-columns:1fr 1fr;gap:clamp(8px,1.4vw,16px);width:min(100%,560px)}
.zc{border:0;cursor:pointer;font-weight:600;font-size:clamp(18px,2.8dvh + .8vw,34px);padding:.7em .4em;border-radius:22px;background:var(--c);color:var(--f);
  opacity:.4;transform:scale(.94);transition:transform .35s var(--pop),opacity .2s,box-shadow .2s;display:flex;align-items:center;justify-content:center;gap:.4em}
.zc.on{opacity:1;transform:none;box-shadow:0 0 0 4px #fff,0 12px 20px -10px rgba(0,0,0,.6)}
.zc:hover{transform:scale(1.04) rotate(-1.5deg)}
.zc .ic{width:1em;height:1em;opacity:0;transform:scale(.4);transition:.3s var(--pop)}
.zc.on .ic{opacity:1;transform:none}
.zlab{font-size:clamp(13px,2dvh + .3vw,22px);opacity:.85}

/* ---------- ระหว่างเล่นเพลง ---------- */
.stagewrap{position:relative;display:grid;place-items:center;width:clamp(130px,28dvh,320px);aspect-ratio:1}
#note{width:78%;animation:dance .55s ease-in-out infinite alternate;filter:drop-shadow(0 14px 18px rgba(0,0,0,.35))}
@keyframes dance{from{transform:rotate(-12deg) translateY(0)}to{transform:rotate(12deg) translateY(-7%)}}
.stagewrap::before,.stagewrap::after{content:"";position:absolute;inset:6%;border-radius:50%;box-shadow:0 0 0 6px rgba(255,255,255,.35);animation:wave 2.4s var(--ease) infinite}
.stagewrap::after{animation-delay:1.2s}
@keyframes wave{from{transform:scale(.55);opacity:.9}to{transform:scale(1.35);opacity:0}}
.eq{display:flex;gap:clamp(6px,1.2vw,14px);align-items:flex-end;height:clamp(28px,5.5dvh,60px)}
.eq i{width:clamp(10px,1.6vw,18px);height:100%;border-radius:99px;background:var(--b);transform-origin:bottom;animation:eq var(--t) ease-in-out infinite alternate}
@keyframes eq{from{transform:scaleY(.2)}to{transform:scaleY(1)}}
#msg{font-weight:600;font-size:clamp(24px,5dvh + 1vw,64px);line-height:1.1;transition:color .2s}
/* ชื่อโซนทั้ง 4 โชว์ไว้ระหว่างเดิน; ตอน "หลอก" ไฟวิ่งวนเหมือนวงล้อ */
.zmini{display:flex;flex-wrap:wrap;gap:clamp(6px,1vw,12px);justify-content:center}
.zmini span{font-weight:600;font-size:clamp(15px,2.4dvh + .5vw,28px);padding:.25em .9em;border-radius:999px;background:var(--c);color:var(--f);opacity:.8;transition:transform .12s,opacity .12s,box-shadow .12s}
.zmini span.hl{opacity:1;transform:scale(1.16);box-shadow:0 0 0 3px #fff,0 8px 16px -6px rgba(0,0,0,.6)}
#s-play.warn #note{animation:shake .12s linear infinite}
#s-play.warn .stagewrap::before,#s-play.warn .stagewrap::after{animation-duration:.7s;box-shadow:0 0 0 8px rgba(255,107,129,.8)}
#s-play.warn .eq i{animation-duration:.18s}
#s-play.warn #msg{color:var(--y)}
@keyframes shake{25%{transform:rotate(-10deg) translateX(-4%)}75%{transform:rotate(10deg) translateX(4%)}}

/* ---------- หยุด! โชว์โซนที่เปิด ---------- */
.zwrap{align-self:stretch;flex:1;min-height:0;display:flex;flex-direction:column;gap:clamp(6px,1.2dvh,12px)}
.zones{flex:1;min-height:0;display:grid;grid-template:1fr 1fr/1fr 1fr;gap:clamp(8px,1.6vw,20px)}
.zt{position:relative;border-radius:clamp(20px,3vw,40px);background:var(--c);color:var(--f);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.15em;min-height:0;overflow:hidden;
  font-weight:600;transition:filter .3s,transform .4s var(--pop),opacity .3s}
.zt .nm{font-size:clamp(26px,7dvh + 2.4vw,120px);line-height:1.05}
.zt .cap{display:flex;align-items:center;gap:.35em;font-size:clamp(14px,2.6dvh + .6vw,34px);opacity:.95}
.zt .cap .ic{width:1.15em;height:1.15em}
.zt.on{box-shadow:0 0 0 clamp(5px,.8vw,10px) #fff,0 30px 50px -20px rgba(0,0,0,.7);animation:zon .7s var(--pop)}
.zt.on .nm{font-size:clamp(30px,9dvh + 3vw,150px)}
.zt.on::after{content:"";position:absolute;inset:0;border-radius:inherit;box-shadow:inset 0 0 0 clamp(4px,.6vw,8px) rgba(255,255,255,.55);animation:zglow 1.2s ease-in-out infinite alternate}
.zt.off{filter:grayscale(.85) brightness(.42);transform:scale(.97)}
.zt.off .nm{font-size:clamp(20px,4.6dvh + 1.6vw,72px);opacity:.75}
.zt.na{filter:grayscale(1) brightness(.3);opacity:.35;transform:scale(.94)}
@keyframes zon{from{transform:scale(.7);filter:brightness(2)}}
@keyframes zglow{to{opacity:.35}}
</style>
</head>
<body>

<section id="s-set" class="scr on">
  <header><a class="hbtn" href="../../" data-ico="home" aria-label="หน้าแรก"></a><h1 class="ttl" data-fx="party-popper">เก้าอี้ดนตรี · 4 โซน</h1></header>
  <main>
    <div class="lbl">เลือกโซนที่ใช้ (วางตามห้องจริง)</div>
    <div class="zlab">หน้าห้อง (ใกล้จอ)</div>
    <div class="zsel" id="zsel"></div>
    <div class="zlab">หลังห้อง</div>
    <div class="panel col">
      <div class="row"><i class="rico" data-ico="music"></i>เพลงเล่นนาน <input class="fld" id="mn" type="number" min="3" value="8"> – <input class="fld" id="mx" type="number" min="3" value="20"> วินาที</div>
      <div class="row"><i class="rico" data-ico="hourglass"></i>หลอกว่าจะหยุด สูงสุด <input class="fld" id="fakes" type="number" min="0" value="2"> ครั้ง/รอบ <small>(สุ่ม, 0 = ไม่หลอก)</small></div>
      <div class="row"><i class="rico" data-ico="timer"></i>ให้เวลาวิ่งไปโซน <input class="fld" id="hold" type="number" min="2" value="6"> วินาที</div>
    </div>
    <div class="err" id="err" role="status"></div>
    <div class="rurl"><div id="qr" hidden></div><div id="rtxt"></div></div>
  </main>
  <footer><button id="start" class="btn go" data-ico="play"> เริ่มเกม</button></footer>
</section>

<section id="s-play" class="scr">
  <header><button class="hbtn" id="end" data-ico="stop" aria-label="จบเกม"></button><div class="hdr-sp"></div><div class="ttl sm" id="rnd"></div></header>
  <main>
    <div class="stagewrap">
      <svg id="note" viewBox="0 0 100 100" aria-hidden="true"><g fill="#fff" stroke="#241552" stroke-width="3.5" stroke-linejoin="round"><ellipse cx="34" cy="76" rx="17" ry="12.5" transform="rotate(-18 34 76)"/><rect x="46" y="14" width="8" height="62" rx="4"/><path d="M54 14c14 4 25 11 23 30-7-8-14-11-23-12Z"/></g></svg>
    </div>
    <div class="eq" aria-hidden="true"></div>
    <div id="msg">เดินไปเรื่อยๆ!</div>
    <div class="zmini" id="zmini"></div>
  </main>
  <footer><button class="btn ghost" id="skip" data-ico="next"> ข้าม</button></footer>
</section>

<section id="s-stop" class="scr">
  <header><button class="hbtn" id="end2" data-ico="stop" aria-label="จบเกม"></button><div class="hdr-sp"></div><div class="ttl sm" id="rnd2"></div></header>
  <main>
    <div class="zwrap">
      <div class="zlab" style="text-align:center">หน้าห้อง (ใกล้จอ)</div>
      <div class="zones" id="zones"></div>
      <div class="zlab" style="text-align:center">หลังห้อง</div>
    </div>
  </main>
  <footer><div id="ring" class="ring"><span id="cnt"></span></div><button class="btn ghost" id="skip2" data-ico="next"> ข้าม</button></footer>
</section>

<script src="../../shared/icons.js"></script>
<script src="../../shared/kids.js"></script>
<script src="../../shared/vol.js"></script>
<script src="../../shared/bgm.js"></script>
<script src="../../shared/qrcode.js"></script>
<script src="../../shared/lobby.js"></script>
<script src="../../shared/config.js"></script>
<script src="../../shared/net.js"></script>
<script src="../../shared/remote-client.js"></script>
<div id="yt" style="position:fixed;left:-9999px;top:0;width:200px;height:200px"><div id="ytp"></div></div>
<script>
const VID='tFQPQqltAmY';
/* 4 โซน วางบนจอเหมือนห้องที่เด็กหันหน้าเข้าจอ: แถวบน = หน้าห้อง (ใกล้จอ), ซ้าย/ขวา = ซ้าย/ขวาของเด็ก */
const ZONES=[
 {n:'หน้าซ้าย',c:'#d62839',f:'#fff'},{n:'หน้าขวา',c:'#29b6f6',f:'#06293a'},
 {n:'หลังซ้าย',c:'#2ea84f',f:'#06210f'},{n:'หลังขวา',c:'#ffd23f',f:'#3a2f00'}
];
const $=id=>document.getElementById(id);
let sel=new Set([0,1,2,3]);
/* จำค่าตั้งค่าไว้ในเครื่อง (สลับเกมแล้วกลับมาค่าเดิมยังอยู่) */
const KEY='miraibu.zones-musical',NK=['mn','mx','fakes','hold'];
function saveCfg(){try{localStorage.setItem(KEY,JSON.stringify({sel:[...sel],...Object.fromEntries(NK.map(k=>[k,$(k).value]))}))}catch(_){}}
(function(){try{const c=JSON.parse(localStorage.getItem(KEY)||'null');if(!c)return;if(Array.isArray(c.sel)&&c.sel.filter(i=>ZONES[i]).length>=2)sel=new Set(c.sel.filter(i=>ZONES[i]));NK.forEach(k=>{if(c[k]!=null)$(k).value=c[k]})}catch(_){}})();
const setZone=(i,on)=>{if(on)sel.add(i);else if(sel.size>2)sel.delete(i);refreshZones();saveCfg();Remote.push()};
function refreshZones(){
  [...$('zsel').children].forEach((b,i)=>{b.classList.toggle('on',sel.has(i));b.setAttribute('aria-pressed',sel.has(i))});
  [...$('zmini').children].forEach((b,i)=>{b.style.display=sel.has(i)?'':'none'});
}
ZONES.forEach((z,i)=>{
  const b=document.createElement('button');b.className='zc';b.style.setProperty('--c',z.c);b.style.setProperty('--f',z.f);
  b.innerHTML=Kids.ICON.check+' ';b.append(document.createTextNode(z.n));
  b.onclick=()=>setZone(i,!sel.has(i));$('zsel').append(b);
  const m=document.createElement('span');m.style.setProperty('--c',z.c);m.style.setProperty('--f',z.f);m.textContent=z.n;$('zmini').append(m);
});
refreshZones();
NK.forEach(k=>$(k).addEventListener('input',()=>{saveCfg();Remote.push()}));
const EQC=['#ff4d6d','#ffd23f','#29b6f6','#34c77b','#a66bff','#ff9f1c','#ff6fae'];
document.querySelector('.eq').append(...EQC.map((c,i)=>{const e=document.createElement('i');e.style.cssText=`--b:${c};--t:${(.28+((i*37)%10)/22).toFixed(2)}s`;return e}));

/* ---- sound ---- */
let ac;function audio(){if(!ac)ac=new (window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume();return ac}
function tone(f,t0,d,type='square',v=.15){const k=window.Vol?Vol.get():1;if(!ac||!k)return;v*=k;const o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.value=f;o.connect(g);g.connect(ac.destination);
  const t=ac.currentTime+t0;g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.start(t);o.stop(t+d+.02)}
const buzz=()=>{tone(880,0,.15);tone(660,.16,.35)};
const chime=()=>{tone(523,0,.15,'triangle');tone(784,.12,.25,'triangle')};
const tick1=()=>tone(1200,0,.04,'square',.08);

/* ---- youtube ---- */
let yt,ytReady=false;
YTReady(()=>{yt=new YT.Player('ytp',{width:200,height:200,videoId:VID,playerVars:{playsinline:1,controls:0,rel:0},
  events:{onReady:()=>{ytReady=true},
   onStateChange:e=>{if(e.data===YT.PlayerState.ENDED&&state==='play'){yt.seekTo(0);yt.playVideo()}},
   onError:e=>{$('err').textContent='เล่นเพลงไม่ได้ (error '+e.data+') — ถ้าเปิดไฟล์ตรงๆ ให้รันผ่าน http เช่น python3 -m http.server';end()}}})});

/* ---- game ---- */
let state='set',timer=0,tick=0,deck=[],last=-1,round=0,fk=[],fiv=0,curZ=null,holdLeft=0,spinIv=0;
function show(id){document.querySelectorAll('.scr').forEach(s=>s.classList.toggle('on',s.id===id))}
function nextZone(){
  if(!deck.length){deck=[...sel].sort(()=>Math.random()-.5);if(deck.length>1&&deck[deck.length-1]===last)deck.reverse()}
  return last=deck.pop();
}
function startGame(){
  if(sel.size<2){$('err').textContent='เลือกอย่างน้อย 2 โซน';return}
  if(!ytReady){$('err').textContent='กำลังโหลดเพลง... ลองกดอีกครั้ง';return}
  $('err').textContent='';audio();round=0;deck=[];last=-1;music();
}
const DANCERS=['woman-dancing','man-dancing'];
function setMsg(ic,t){$('msg').innerHTML=Kids.fx(ic)+' ';$('msg').append(document.createTextNode(t))}
/* วงล้อ: ไฟวิ่งวนผ่านโซนที่ใช้ แล้วดับ (ใช้ตอน "หลอก") */
function spinZones(ms){
  clearInterval(spinIv);const act=[...sel],kids=[...$('zmini').children];let n=Math.floor(Math.random()*act.length),t0=Date.now();
  spinIv=setInterval(()=>{kids.forEach(k=>k.classList.remove('hl'));
    if(Date.now()-t0>=ms){clearInterval(spinIv);return}
    kids[act[n%act.length]].classList.add('hl');n++;tick1()},110);
}
function clr(){clearTimeout(timer);fk.forEach(clearTimeout);fk=[];clearInterval(fiv);clearInterval(tick);clearInterval(spinIv);
  [...$('zmini').children].forEach(k=>k.classList.remove('hl'));$('s-play').classList.remove('warn');setMsg(DANCERS[round%2],'เดินไปเรื่อยๆ!')}
/* หลอก: เสียงค่อยๆ เบาลงจนเงียบ + ไฟวิ่งวนระหว่างโซน แล้วเด้งกลับมาเล่นต่อ (เพลงไม่ได้หยุดจริง) */
const DIP=1200;
function fake(){
  const t0=Date.now(),hold=500+Math.random()*700;
  $('s-play').classList.add('warn');setMsg('hourglass-not-done','ใกล้หยุดแล้ว...!');Remote.push();
  spinZones(DIP+hold);
  fiv=setInterval(()=>{const p=Math.min((Date.now()-t0)/DIP,1);yt.setVolume(Math.round(Vol.pct()*(1-p)*(1-p)));if(p>=1)clearInterval(fiv)},60);
  fk.push(setTimeout(()=>{
    clearInterval(fiv);yt.setVolume(Vol.pct());$('s-play').classList.remove('warn');setMsg('face-with-tongue','หลอกกก!');chime();Remote.push();
    $('msg').classList.remove('wiggle');void $('msg').offsetWidth;$('msg').classList.add('wiggle');
    fk.push(setTimeout(()=>{if(state==='play'){setMsg(DANCERS[round%2],'เดินไปเรื่อยๆ!');$('msg').classList.remove('wiggle')}},1500));
  },DIP+hold));
}
function music(){
  clr();state='play';round++;
  $('rnd').textContent='รอบที่ '+round;show('s-play');
  yt.setVolume(Vol.pct());yt.playVideo();BGM.sync();
  let a=Math.max(3,+$('mn').value||8),b=Math.max(a,+$('mx').value||20);
  const total=(a+Math.random()*(b-a))*1000;
  timer=setTimeout(stop,total);
  const n=Math.floor(Math.random()*(Math.max(0,+$('fakes').value||0)+1)),ts=[];
  for(let i=0;i<n;i++){
    const lo=2000,hi=total-3400;if(hi<lo)break;
    const t=lo+Math.random()*(hi-lo);if(ts.every(x=>Math.abs(x-t)>5000))ts.push(t);
  }
  ts.forEach(t=>fk.push(setTimeout(fake,t)));
  Remote.push();
}
/* วาด 4 ช่อง: โซนที่เปิด = สว่าง "ไปที่นี่!" / โซนอื่น = มืด "ปิด" / โซนที่ไม่ได้ใช้ = จาง */
function drawZones(open){
  const box=$('zones');box.replaceChildren();
  ZONES.forEach((z,i)=>{
    const t=document.createElement('div');t.className='zt '+(!sel.has(i)?'na':i===open?'on':'off');t.style.setProperty('--c',z.c);t.style.setProperty('--f',z.f);
    const nm=document.createElement('div');nm.className='nm';nm.textContent=z.n;t.append(nm);
    if(sel.has(i)){const cap=document.createElement('div');cap.className='cap';
      cap.innerHTML=(i===open?Kids.ICON.check:Kids.ICON.no)+' ';cap.append(document.createTextNode(i===open?'ไปที่นี่!':'ปิด'));t.append(cap)}
    box.append(t);
  });
}
function stop(){
  clr();state='stop';
  yt.pauseVideo();buzz();
  const zi=nextZone(),hold=Math.max(2,+$('hold').value||6),ring=$('ring');curZ=ZONES[zi];holdLeft=hold;
  drawZones(zi);
  $('rnd2').textContent='รอบที่ '+round;
  show('s-stop');navigator.vibrate&&navigator.vibrate([100,50,200]);
  const t0=Date.now();
  ring.classList.remove('zero','hurry');
  const upd=()=>{const el=(Date.now()-t0)/1000,left=Math.ceil(hold-el);ring.style.setProperty('--p',Math.max(0,100-el/hold*100));$('cnt').textContent=Math.max(left,0);holdLeft=Math.max(left,0);
    ring.classList.toggle('hurry',left<=3&&left>0);
    if(el>=hold){clearInterval(tick);chime();music()}};
  upd();tick=setInterval(upd,100);Remote.push();
}
function end(){clr();state='set';if(yt&&yt.pauseVideo)yt.pauseVideo();show('s-set');Remote.push();BGM.sync()}
function skip(){state==='play'?stop():state==='stop'?(clearInterval(tick),music()):0}
$('start').onclick=startGame;
$('skip').onclick=$('skip2').onclick=skip;
$('end').onclick=$('end2').onclick=end;
addEventListener('keydown',e=>{if(e.key===' '&&state!=='set'){e.preventDefault();skip()}if(e.key==='Escape')end()});

/* เกมนี้มีเพลงของตัวเอง → เพลงพื้นหลังดังเฉพาะตอนตั้งค่า (ระหว่างเล่นต้องเงียบ เพราะ "เพลงหยุด" คือสัญญาณของเกม) */
BGM.init({allow:()=>state==='set'});
Vol.on(()=>{if(state==='play'&&yt&&!$('s-play').classList.contains('warn'))yt.setVolume(Vol.pct())});
const RT='เก้าอี้ดนตรี';
const NUMS={mn:{t:'เพลงเล่นนานอย่างน้อย',min:3,u:'วิ'},mx:{t:'เพลงเล่นนานอย่างมาก',min:3,u:'วิ'},fakes:{t:'หลอกว่าจะหยุด สูงสุด',min:0,max:5,u:'ครั้ง/รอบ'},hold:{t:'เวลาวิ่งไปโซน',min:2,u:'วิ'}};
function settingsUi(){return[{type:'h',t:'โซนที่ใช้ (หน้าห้องอยู่ใกล้จอ)',ico:'grid'},
  ...ZONES.map((z,i)=>({k:'z'+i,type:'toggle',t:z.n,v:sel.has(i)})),
  {type:'h',t:'จังหวะเพลง',ico:'music'},
  ...NK.map(k=>({k,type:'number',t:NUMS[k].t,v:+$(k).value||0,min:NUMS[k].min,max:NUMS[k].max,u:NUMS[k].u}))]}
function applySet(a){
  if(!a)return;
  if(/^z[0-3]$/.test(a.k))setZone(+a.k[1],!!a.v);
  else if(NUMS[a.k]){$(a.k).value=a.v;saveCfg();Remote.push()}
}
Remote.init({id:'color-musical',needsSound:true,qrEl:$('qr'),txtEl:$('rtxt'),lobby:()=>state==='set'?'เก้าอี้ดนตรี 4 โซน':false,
  getUi:()=>{
    const END={t:'จบเกม',cmd:'end',ico:'stop',k:'ghost',confirm:'จบเกมตอนนี้?'};
    if(state==='set')return{title:RT,settings:settingsUi(),foot:[{t:'เริ่มเกม',cmd:'start',ico:'play',k:'go'}]};
    if(state==='play')return{title:RT,info:'รอบที่ '+round,msg:$('msg').textContent,buttons:[{t:'หยุดเพลงเลย',cmd:'skip',ico:'next'}],foot:[END]};
    return{title:RT,info:'รอบที่ '+round,timer:holdLeft,cards:[{l:'โซนที่เปิดบนจอ',t:curZ?curZ.n:'',c:curZ&&curZ.c,f:curZ&&curZ.f}],buttons:[{t:'เล่นเพลงต่อเลย',cmd:'skip',ico:'next'}],foot:[END]};
  },
  onCmd:c=>{
    if(c.cmd==='start'&&state==='set')startGame();
    else if(c.cmd==='set'&&state==='set')applySet(c.arg);
    else if(c.cmd==='skip')skip();
    else if(c.cmd==='end'&&state!=='set')end();
  }});
</script>
</body>
</html>
